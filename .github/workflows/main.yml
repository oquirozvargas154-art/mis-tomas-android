name: Mis Tomas V7 Diagnostico
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Descomprimir proyecto
        run: unzip -o mis_tomas_v7_android_source.zip

      - name: Crear version independiente de prueba
        working-directory: mis_tomas_v7_android
        run: |
          sed -i 's/cl\.tottemlab\.mistomas/cl.tottemlab.mistomas.v7test/g' capacitor.config.json
          sed -i 's/"appName": "Mis Tomas"/"appName": "Mis Tomas V7 Prueba"/g' capacitor.config.json
          cat capacitor.config.json

      - name: Instalar dependencias
        working-directory: mis_tomas_v7_android
        run: npm install

      - name: Crear proyecto Android
        working-directory: mis_tomas_v7_android
        run: npm run android:init

      - name: Compilar APK
        working-directory: mis_tomas_v7_android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Tomas-V7-Diagnostico-APK
          path: mis_tomas_v7_android/android/app/build/outputs/apk/debug/app-debug.apk
